[project]
name = "qwen3-auto-interp"
version = "0.1.0"
description = "Local, falsification-first mechanistic interpretability of Qwen3"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6,<3", "transformers>=4.51,<5", "duckdb>=1.2,<2",
  "pydantic>=2.10,<3", "PyYAML>=6,<7",
  "networkx>=3.4,<4", "rich>=13.9,<15", "numpy>=1.26,<3",
  "pyarrow>=19,<24", "tokenizers>=0.21,<1",
]

[project.scripts]
qwen-interp = "src.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["hardware: opt-in real Qwen on Apple MPS", "codex: opt-in authenticated Codex CLI smoke test"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

